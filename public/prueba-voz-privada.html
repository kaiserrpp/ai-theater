<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AI-Theatre</title>
</head>
<body>
  <p>Abre una escena y elige OpenAI en «Micrófono y voz» con tu sesión de administrador.</p>
  <a href="/">Volver a AI-Theatre</a>
  <script>
    const home = new URL('/', location.origin);
    const share = new URLSearchParams(location.search).get('share');
    if (share && /^[a-z0-9-]{1,40}$/i.test(share)) home.searchParams.set('share', share);
    location.replace(home);
  </script>
</body>
</html>
